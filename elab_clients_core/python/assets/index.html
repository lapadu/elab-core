<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Lab: Direct Device Interface</title>
    
    <!-- Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { slate: { 850: '#1e293b', 900: '#0f172a', 950: '#020617' } },
                    animation: { 'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite' }
                }
            }
        }
    </script>
    
    <style>
        body { background-color: #020617; color: #e2e8f0; }
        .spinner {
            width: 40px; height: 40px; border: 4px solid rgba(59, 130, 246, 0.3);
            border-radius: 50%; border-top-color: #3b82f6; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- LUCIDE ADAPTER ---
        const createLucideIcon = (iconName, iconNode) => {
            return ({ color, size = 24, strokeWidth = 2, className, ...props }) => {
                return React.createElement('svg', {
                    xmlns: "http://www.w3.org/2000/svg", width: size, height: size, viewBox: "0 0 24 24",
                    fill: "none", stroke: color || "currentColor", strokeWidth: strokeWidth,
                    strokeLinecap: "round", strokeLinejoin: "round", className: className, ...props
                }, (Array.isArray(iconNode) ? iconNode : []).map((child, i) => React.createElement(child[0], { key: i, ...child[1] })));
            };
        };
        const Icons = new Proxy({}, {
            get: (target, prop) => (window.lucide?.icons?.[prop]) ? createLucideIcon(prop, window.lucide.icons[prop]) : () => null
        });

        // --- PLUGIN REGISTRY ---
        window.ElabPlugins = {};
        window.registerElabPlugin = (id, factory) => {
            try {
                window.ElabPlugins[id] = factory(React, Icons);
                window.dispatchEvent(new CustomEvent('elab-plugin-loaded', { detail: { id } }));
            } catch (err) { console.error(err); }
        };

        // --- SELF-HOSTED CONNECTION ---
        const useSelfConnection = () => {
            const [connected, setConnected] = useState(false);
            const [device, setDevice] = useState(null);
            const [data, setData] = useState({});

            useEffect(() => {
                // Connect to "origin" (meaning: connect to the server that served this HTML file)
                // This makes it work on localhost, LAN IP, or public IP automatically.
                const socket = io(window.location.origin);

                socket.on('connect', () => {
                    setConnected(true);
                    socket.emit('register_client', { type: 'standalone' });
                });

                socket.on('disconnect', () => {
                    setConnected(false);
                    setDevice(null);
                });

                socket.on('available_providers', (payload) => {
                    // In Standalone mode, the server sends us directly the manifest in the list
                    if (payload.providers && payload.providers.length > 0) {
                        setDevice(payload.providers[0]);
                    }
                });

                socket.on('data_stream', (payload) => {
                    if (payload?.sourceId) {
                        setData(prev => ({ ...prev, [payload.sourceId]: payload }));
                    }
                });

                return () => socket.disconnect();
            }, []);

            return { connected, device, data };
        };

        const App = () => {
            const [PluginComponent, setPluginComponent] = useState(null);
            const [status, setStatus] = useState('WAITING'); 
            const { connected, device, data } = useSelfConnection();

            const activeTask = useMemo(() => device?.tasks?.[0] ? { ...device.tasks[0], providerId: device.id } : null, [device]);

            useEffect(() => {
                if (!connected) { setStatus('CONNECTING'); return; }
                if (!activeTask) { setStatus('WAITING_MANIFEST'); return; }
                
                // If we have the component cached
                if (window.ElabPlugins[activeTask.ui.componentName]) {
                    setPluginComponent(() => window.ElabPlugins[activeTask.ui.componentName]);
                    setStatus('READY');
                    return;
                }

                // Load Script
                setStatus('LOADING_SCRIPT');
                const script = document.createElement('script');
                script.src = activeTask.ui.url;
                script.async = true;
                
                const onLoaded = (e) => {
                    if (e.detail.id === activeTask.ui.componentName) {
                        setPluginComponent(() => window.ElabPlugins[activeTask.ui.componentName]);
                        setStatus('READY');
                    }
                };
                window.addEventListener('elab-plugin-loaded', onLoaded);
                document.body.appendChild(script);

                return () => {
                    window.removeEventListener('elab-plugin-loaded', onLoaded);
                    if(script.parentNode) script.parentNode.removeChild(script);
                }
            }, [connected, activeTask]);

            return (
                <div className="min-h-screen flex flex-col font-sans selection:bg-purple-500/30">
                    <header className="h-14 border-b border-slate-800 bg-slate-950/80 backdrop-blur flex items-center justify-between px-6 sticky top-0 z-50">
                        <div className="flex items-center gap-3">
                            <div className="bg-purple-600 p-1 rounded"><Icons.Cpu size={18} className="text-white" /></div>
                            <h1 className="font-bold text-slate-100">E-Lab <span className="text-purple-400">Direct</span></h1>
                        </div>
                        <div className={`text-[10px] font-bold px-2 py-1 rounded border flex items-center gap-2 ${connected ? 'border-emerald-500/30 text-emerald-400 bg-emerald-500/10' : 'border-red-500/30 text-red-400'}`}>
                            <div className={`w-1.5 h-1.5 rounded-full ${connected ? 'bg-emerald-400' : 'bg-red-400 animate-pulse'}`}></div>
                            {connected ? 'ONLINE' : 'DISCONNECTED'}
                        </div>
                    </header>

                    <main className="flex-1 p-6 flex items-center justify-center relative">
                        <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black opacity-50"></div>
                        
                        <div className="w-full max-w-3xl aspect-[16/9] bg-slate-900/50 backdrop-blur rounded-2xl border border-slate-800 shadow-2xl overflow-hidden relative z-10">
                            {status !== 'READY' && (
                                <div className="absolute inset-0 flex flex-col items-center justify-center">
                                    <div className="spinner mb-4"></div>
                                    <div className="text-slate-500 text-xs font-mono uppercase tracking-widest">{status}...</div>
                                </div>
                            )}

                            {status === 'READY' && PluginComponent && (
                                <PluginComponent task={activeTask} dataStreams={data} isConfigMode={false} onUpdateTask={() => {}} />
                            )}
                        </div>
                    </main>
                    <footer className="py-2 text-center text-slate-700 text-[10px] font-mono">Self-Hosted Device Runtime</footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
