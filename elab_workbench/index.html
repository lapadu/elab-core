        <h1>E-Lab: Real-Time IoT Measurement Lab</h1>
        <p>
          E-Lab connects sensors, oscilloscopes, actuators, and ESP32 projects to a modular
          browser-based workbench for live measurement data.
        </p>
        <p>
          The project combines a decoupled Python backend with a React frontend for flexible
          hardware monitoring and control.
        </p>
        <h2>Features</h2>
        <ul>
          <li>Real-time sensor data over WebSockets</li>
          <li>Zero-configuration device discovery over UDP</li>
          <li>Session recording, replay, and FFT analysis</li>
          <li>Python and ESP32 client integrations</li>
        </ul>
        <p lang="de">
          Deutsch: E-Lab ist ein verteiltes IoT-Messlabor für Echtzeit-Sensordaten,
          ESP32-Projekte und modulare Hardware-Überwachung.
