[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elab-local-api"
version = "0.1.0"
description = "E-Lab Local API and bridge daemon"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "E-Lab" }
]
dependencies = [
  "numpy>=1.24",
  "pyzmq>=25.0",
  "python-socketio>=5.10",
]

[project.scripts]
elab-bridge-daemon = "elab_bridge.bridge_daemon:main"

[tool.setuptools.packages.find]
# Bewusste Entscheidung: ``pip install -e .`` installiert nur die schlanke
# Local-API + Bridge. Clients (``elab_clients_core`` / ``elab_clients_premium``)
# und der Dispatcher (``elab_server``) werden separat ausgeliefert (eigene
# Repos / PyInstaller-Spec-Dateien) und sind hier absichtlich NICHT enthalten.
include = ["elab_api*", "elab_bridge*"]

[tool.setuptools.package-data]
elab_api = ["py.typed"]
