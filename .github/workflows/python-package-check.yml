name: Python Package Check

on:
  push:
    paths:
      - "pyproject.toml"
      - "elab_api/**"
      - "elab_bridge/**"
      - "tools/generate_python_api_reference.py"
      - ".github/workflows/python-package-check.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "elab_api/**"
      - "elab_bridge/**"
      - "tools/generate_python_api_reference.py"
      - ".github/workflows/python-package-check.yml"

jobs:
  package-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Install package (editable)
        run: python -m pip install -e .

      - name: Import smoke test
        run: |
          python - <<'PY'
          from elab_api import LocalNode, SharedMemoryChannel
          from elab_bridge.bridge_daemon import BridgeDaemon
          print("Imports OK:", LocalNode.__name__, SharedMemoryChannel.__name__, BridgeDaemon.__name__)
          PY

      - name: Generate API reference
        run: python tools/generate_python_api_reference.py

      - name: Validate generated documentation exists
        run: test -f doc/python_api_reference.md
