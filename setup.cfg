[pylint.MESSAGES CONTROL]
# C0413 wrong-import-position: server.py and client files must run
#        gevent.monkey.patch_all() before any other imports.
# C0411 wrong-import-order: same reason.
# C0415 import-outside-toplevel: wmi and similar optional deps are
#        imported conditionally inside functions.
disable =
    wrong-import-position,
    wrong-import-order,
    import-outside-toplevel

[pylint.FORMAT]
max-line-length = 120
